[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-attention-mask-generator"
version = "0.1.0"
description = "Task-adaptive block-sparse attention mask generator optimizing LLM prompt compilation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
sparse-attention-mask-generator = "sparse_attention_mask_generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparse_attention_mask_generator*"]
